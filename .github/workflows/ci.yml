name: CI

on:
  push:
    branches: [main, master, develop]
  # No branch filter: stacked PRs target feature branches and must run CI too
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metro3d_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/metro3d_test_ci
      TEST_DATABASE_URL: postgresql://metro3d_ci_app@127.0.0.1:5432/metro3d_test_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: PostgreSQL migration and restricted-role integration
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE metro3d_ci_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE'
          DATABASE_URL="$TEST_ADMIN_DATABASE_URL" npm run db:migrate
          DATABASE_URL="$TEST_ADMIN_DATABASE_URL" DB_RUNTIME_ROLE=metro3d_ci_app npx tsx src/db/cli.ts grant
          npm run test:db
          npx tsx --test src/db/backup.integration.ts
      - run: node --test ../scripts/deploy-release.test.mjs
      - run: npm run build
      - run: npm audit --audit-level=high

  frontend:
    name: Frontend (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metro3d_test_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare PostgreSQL-backed preview
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/metro3d_test_e2e
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE metro3d_e2e_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE'
          npm run db:migrate
          DB_RUNTIME_ROLE=metro3d_e2e_app npx tsx src/db/cli.ts grant
          npm run db:seed
      - name: Start single-service app
        working-directory: backend
        env:
          PORT: 3020
          SERVE_STATIC_DIR: ${{ github.workspace }}/frontend/dist
          FRONTEND_ORIGIN: http://localhost:3020
          CACHE_BACKEND: postgres
          DATABASE_URL: postgresql://metro3d_e2e_app@127.0.0.1:5432/metro3d_test_e2e
        run: |
          node dist/server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3020/api/health > /dev/null && break
            sleep 1
          done
          curl --fail http://localhost:3020/api/health
          curl --fail http://localhost:3020/
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3020
        run: npx playwright test
      - name: Upload scene screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scene
          path: |
            frontend/e2e-scene.png
            frontend/e2e-cab.png
            frontend/e2e-mobile.png
            frontend/test-results/
          if-no-files-found: ignore
      - name: Package verified release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$RELEASE_SHA" > RELEASE_SHA
          tar -czf release.tar.gz RELEASE_SHA backend/dist backend/package.json backend/package-lock.json frontend/dist
      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: metro3d-release
          path: release.tar.gz
          retention-days: 14
